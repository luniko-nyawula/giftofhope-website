<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift of Hope Foundation | Enquiry</title>
</head>
<body>

    <header>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="../index.html" aria-current="page">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html" aria-current="page">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Get Involved / Make an Enquiry</h1>
            <p>Interested in volunteering or becoming a sponsor? Fill out the form below.</p>

            <form action="#" method="POST">
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="phone">Cellphone Number:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div>
                    <label for="enquiry-type">Enquiry Type:</label>
                    <select id="enquiry-type" name="enquiry_type" required>
                        <option value="">-- Select Option --</option>
                        <option value="volunteer">Volunteer Opportunity</option>
                        <option value="sponsor">Sponsorship / Donation</option>
                        <option value="general">General Enquiry</option>
                    </select>
                </div>

                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Gift of Hope Foundation. All rights reserved.</p>
    </footer>

</body>
</html>
